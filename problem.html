<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài tập — QNOJ</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0A0F1E;--panel:#111A2E;--panel-2:#141F38;--line:#233053;--text:#E9EDF8;--muted:#8C97B8;
    --ac:#34D399;--wa:#FB6B6B;--gold:#F2B84B;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--ink);color:var(--text);font-family:'Space Grotesk',sans-serif;}
  .wrap{max-width:820px;margin:0 auto;padding:40px 24px 90px;}
  .logo a{font-weight:700;font-size:18px;color:var(--text);} .logo span{color:var(--ac);}
  a.back{font-size:13px;color:var(--muted);display:inline-block;margin:22px 0 6px;}
  h1{font-size:26px;margin:6px 0 6px;}
  .meta{display:flex;gap:14px;margin-bottom:24px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);}
  .desc{white-space:pre-wrap;line-height:1.7;font-size:15px;color:#D3DAEE;margin-bottom:28px;}
  .sample{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:12px;}
  .sample h4{font-size:12px;color:var(--muted);margin-bottom:8px;font-family:'JetBrains Mono',monospace;}
  .sample pre{font-family:'JetBrains Mono',monospace;font-size:13px;white-space:pre-wrap;color:var(--text);}
  textarea{
    width:100%;height:280px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13.5px;padding:16px;margin-top:20px;resize:vertical;
  }
  textarea:focus{outline:none;border-color:var(--ac);}
  button{margin-top:14px;padding:11px 24px;border:none;border-radius:8px;background:var(--ac);color:#06170F;
    font-weight:600;font-size:14.5px;cursor:pointer;}
  button:disabled{opacity:.5;cursor:default;}
  .result{margin-top:20px;padding:16px 18px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
    font-family:'JetBrains Mono',monospace;font-size:13.5px;display:none;}
  .verdict{font-weight:700;font-size:16px;padding:2px 0;}
  .verdict.AC{color:var(--ac);} .verdict.WA{color:var(--wa);} .verdict.TLE{color:var(--gold);}
  .verdict.RTE{color:#FF9F6B;} .verdict.CE{color:#B27DFF;} .verdict.pending, .verdict.judging{color:var(--muted);}
  .loginwarn{color:var(--muted);font-size:14px;margin-top:20px;}
  .loginwarn a{color:var(--ac);}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><a href="index.html">QNOJ<span>.</span></a></div>
  <a class="back" href="problems.html">← Danh sách bài</a>
  <h1 id="title">Đang tải…</h1>
  <div class="meta" id="meta"></div>
  <div class="desc" id="desc"></div>
  <div id="samples"></div>

  <div id="submitArea"></div>
</div>

<script type="module">
  import { supabase, requireProfile, JUDGE_SERVER_URL, JUDGE_SHARED_SECRET } from './js/supabaseClient.js';

  const params = new URLSearchParams(location.search);
  const problemId = params.get('id');
  const diffLabel = { easy: 'Dễ', medium: 'Trung bình', hard: 'Khó' };

  const { data: problem } = await supabase
    .from('problems')
    .select('*, categories(name)')
    .eq('id', problemId)
    .single();

  if (!problem) {
    document.getElementById('title').textContent = 'Không tìm thấy bài';
  } else {
    document.getElementById('title').textContent = problem.title;
    document.getElementById('meta').innerHTML = `
      <span>${problem.categories?.name ?? 'Chưa phân loại'}</span>
      <span>${diffLabel[problem.difficulty] ?? problem.difficulty}</span>
      <span>Giới hạn: ${problem.time_limit_ms} ms</span>`;
    document.getElementById('desc').textContent = problem.description;

    const { data: samples } = await supabase
      .from('test_cases').select('*').eq('problem_id', problemId).eq('is_sample', true).order('position');
    const samplesEl = document.getElementById('samples');
    (samples ?? []).forEach((s, i) => {
      samplesEl.innerHTML += `
        <div class="sample"><h4>VÍ DỤ ${i + 1} — INPUT</h4><pre>${s.input}</pre></div>
        <div class="sample"><h4>VÍ DỤ ${i + 1} — OUTPUT</h4><pre>${s.expected_output}</pre></div>`;
    });
  }

  const profile = await requireProfile();
  const submitArea = document.getElementById('submitArea');

  if (!profile) {
    submitArea.innerHTML = `<div class="loginwarn"><a href="login.html">Đăng nhập</a> để nộp bài.</div>`;
  } else {
    submitArea.innerHTML = `
      <textarea id="code" placeholder="// Dán code C++ của bạn vào đây"></textarea>
      <br><button id="submitBtn">Nộp bài</button>
      <div class="result" id="result"><span class="judge-label">Trạng thái: </span><span class="verdict" id="verdictText">—</span>
        <div id="detail" style="margin-top:6px;color:var(--muted);"></div>
      </div>`;

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const code = document.getElementById('code').value.trim();
      if (!code) return;
      const btn = document.getElementById('submitBtn');
      const resultBox = document.getElementById('result');
      const verdictText = document.getElementById('verdictText');
      const detail = document.getElementById('detail');

      btn.disabled = true;
      resultBox.style.display = 'block';
      verdictText.className = 'verdict pending';
      verdictText.textContent = 'ĐANG GỬI…';
      detail.textContent = '';

      const { data: submission, error } = await supabase
        .from('submissions')
        .insert({ user_id: profile.id, problem_id: problemId, source_code: code, language: 'cpp' })
        .select().single();

      if (error) {
        verdictText.textContent = 'LỖI';
        detail.textContent = error.message;
        btn.disabled = false;
        return;
      }

      // Kick off judging on the judge server (fire-and-forget), then poll Supabase for the result.
      fetch(`${JUDGE_SERVER_URL}/api/judge`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-judge-secret': JUDGE_SHARED_SECRET },
        body: JSON.stringify({ submission_id: submission.id }),
      }).catch(() => {});

      const poll = setInterval(async () => {
        const { data: s } = await supabase.from('submissions').select('*').eq('id', submission.id).single();
        if (!s) return;
        verdictText.className = `verdict ${s.status}`;
        verdictText.textContent = s.status === 'pending' ? 'ĐANG CHỜ…' : s.status === 'judging' ? 'ĐANG CHẤM…' : s.status;
        if (['AC','WA','TLE','RTE','CE'].includes(s.status)) {
          clearInterval(poll);
          btn.disabled = false;
          detail.textContent = s.status === 'AC'
            ? `Thời gian chạy: ${s.runtime_ms} ms`
            : s.failed_test_case ? `Sai tại test #${s.failed_test_case}` : '';
        }
      }, 1200);
    });
  }
</script>
</body>
</html>

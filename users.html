<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh sách người dùng — QNOJ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="wrap" style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
    <h2>Danh sách người dùng</h2>
    
    <!-- Ô tìm kiếm người dùng -->
    <input type="text" id="searchInput" placeholder="Tìm kiếm theo username..." style="width: 100%; padding: 10px; margin: 20px 0; border-radius: 6px; border: 1px solid #333; background: #1a1a2e; color: #fff;">

    <!-- Khung chứa danh sách -->
    <div id="userList" style="display: grid; gap: 12px;"></div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js';
    import { renderNavbar } from './js/navbar.js';

    renderNavbar();

    const userList = document.getElementById('userList');
    const searchInput = document.getElementById('searchInput');
    let allUsers = [];

    async function loadUsers() {
      const { data, error } = await supabase.from('profiles').select('*');
      if (error) {
        userList.innerHTML = 'Lỗi tải danh sách người dùng.';
        return;
      }
      allUsers = data || [];
      renderUsers(allUsers);
    }

    function renderUsers(users) {
      if (users.length === 0) {
        userList.innerHTML = '<p>Không tìm thấy người dùng nào.</p>';
        return;
      }
      userList.innerHTML = users.map(u => `
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #16213e; border-radius: 8px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <img src="${u.avatar_url || 'https://via.placeholder.com/40'}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;" />
            <div>
              <strong style="color: #fff; display: block;">${u.username || 'User'}</strong>
              <span style="font-size: 12px; color: #888;">${u.role || 'user'}</span>
            </div>
          </div>
          <a href="profile.html?id=${u.id}" style="color: #4ecca3; text-decoration: none;">Xem hồ sơ</a>
        </div>
      `).join('');
    }

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allUsers.filter(u => u.username?.toLowerCase().includes(query));
      renderUsers(filtered);
    });

    loadUsers();
  </script>
</body>
</html>
